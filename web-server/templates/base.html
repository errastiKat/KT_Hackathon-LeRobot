<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>LeRobot Face Painter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <!-- Bootstrap Icons (para el micro, etc.) -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="#">
            <i class="bi bi-robot me-2"></i>LeRobot Face Painter
        </a>
        <div class="ms-auto small text-secondary d-none d-md-block">
            <span class="me-3"><i class="bi bi-camera-video me-1"></i>Reconocimiento facial</span>
            <span class="me-3"><i class="bi bi-mic me-1"></i>Grabadora de voz</span>
            <span><i class="bi bi-vector-pen me-1"></i>Dibujo en papel</span>
        </div>
    </div>
</nav>

<main class="py-4">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="py-3 small text-center text-secondary">
    LeRobot · Demo UI (Flask + Bootstrap)
</footer>

<!-- Bootstrap JS bundle -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>

<!-- JS propio -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>

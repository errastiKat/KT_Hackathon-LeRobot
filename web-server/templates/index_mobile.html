<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeRobot iPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ocultamos el canvas que usamos para capturar frames */
        #capture-canvas { display: none; }
        /* El video ocupa el contenedor */
        video { width: 100%; border-radius: 10px; transform: scaleX(-1); /* Efecto espejo */ }
    </style>
</head>
<body class="bg-light">

<div class="container py-3">
    <h3 class="text-center mb-3">📸 Cámara Web Remota</h3>
    
    <div class="card shadow-sm mb-3">
        <div class="card-body text-center">
            <div class="ratio ratio-4x3 bg-black rounded mb-2">
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <canvas id="capture-canvas"></canvas>

            <button id="start-cam-btn" class="btn btn-primary w-100">
                🔓 Activar Cámara iPhone
            </button>
            
            <div class="mt-2 d-flex justify-content-between">
                <span class="badge bg-secondary" id="face-status">Esperando cara...</span>
                <span class="badge bg-secondary" id="smile-status">😐 Serio</span>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-header">Última Captura</div>
        <div class="card-body text-center">
            <img id="captured-result" src="" class="img-fluid d-none rounded">
            <p class="text-muted small mt-2" id="capture-msg">Sonríe para tomar la foto automáticamante</p>
            <button onclick="fetch('/api/reset')" class="btn btn-sm btn-outline-danger">Resetear Estado</button>
        </div>
    </div>
    
    <div class="alert alert-warning small">
        <strong>Nota:</strong> El reconocimiento de voz sigue usando el micrófono del portátil (Server).
    </div>
</div>

<script>
    const video = document.getElementById('local-video');
    const canvas = document.getElementById('capture-canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-cam-btn');
    
    let streaming = false;
    let photoTaken = false;

    // 1. INICIAR CÁMARA DEL IPHONE
    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, // Cámara frontal
                audio: false 
            });
            video.srcObject = stream;
            streaming = true;
            startBtn.style.display = 'none';
            startProcessing();
        } catch (err) {
            alert("Error cámara: " + err);
            console.error(err);
        }
    });

    // 2. ENVIAR FRAMES AL SERVIDOR (Cada 500ms para no saturar)
    function startProcessing() {
        setInterval(() => {
            if (!streaming || photoTaken) return;

            // Dibujar video en canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convertir a JPG Base64
            const dataURL = canvas.toDataURL('image/jpeg', 0.5); // Calidad 0.5

            // Enviar a Python
            fetch('/api/process-frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataURL })
            })
            .then(res => res.json())
            .then(data => {
                // Actualizar UI
                document.getElementById('face-status').className = data.face ? 'badge bg-success' : 'badge bg-secondary';
                document.getElementById('face-status').innerText = data.face ? 'Cara Detectada' : 'Sin Cara';
                
                document.getElementById('smile-status').className = data.smile ? 'badge bg-warning text-dark' : 'badge bg-secondary';
                document.getElementById('smile-status').innerText = data.smile ? '😁 Sonriendo' : '😐 Serio';

                if (data.taken) {
                    photoTaken = true;
                    document.getElementById('capture-msg').innerText = "¡Foto capturada y guardada en servidor!";
                    // Opcional: Detener envío de frames
                }
            })
            .catch(err => console.error("Error envío frame:", err));

        }, 500); // 500ms = 2 frames por segundo (suficiente para detectar sonrisa)
    }
</script>
</body>
</html>
